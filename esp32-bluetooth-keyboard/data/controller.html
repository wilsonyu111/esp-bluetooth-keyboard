<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ESP32 Controller</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      html,
      body {
        min-height: 100%;
        background: rgb(46, 44, 44);
      }

      body {
        margin: 0;
        font-family: system-ui, "Segoe UI Symbol", "Noto Sans Symbols", sans-serif;
        font-size: 16px;
        color: #eee;
      }

      .main-block {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 24px 16px 40px;
        box-sizing: border-box;
      }

      h1 {
        margin: 0;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .status {
        margin: 8px 0 20px;
        padding: 6px 12px;
        border-radius: 999px;
        font-size: 14px;
      }

      .status.paired {
        background: #1f5c3a;
      }

      .status.unpaired {
        background: #5c3a1f;
      }

      .pad {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        width: min(360px, 100%);
      }

      .pad button {
        appearance: none;
        border: 1px solid #666;
        border-radius: 16px;
        background: rgba(0, 0, 0, 0.55);
        color: #eee;
        min-height: 88px;
        font-size: 36px;
        line-height: 1;
        cursor: pointer;
        display: grid;
        place-items: center;
      }

      .pad button.primary {
        grid-column: 1 / -1;
        background: rgba(40, 90, 140, 0.85);
        border-color: #6aa0d8;
      }

      .pad button.active {
        background: #3a7a55;
        border-color: #7dcea0;
      }

      .pad button .glyph {
        font-size: 36px;
      }

      .pad button .glyph.small {
        font-size: 20px;
        font-weight: 600;
      }

      .combo-panel {
        width: min(720px, 100%);
        margin-top: 8px;
      }

      .repeat-controls {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .combo-table .repeat-controls select,
      .combo-table .repeat-controls input {
        width: auto;
        height: 36px;
      }

      .repeat-value {
        width: 72px;
      }

      .repeat-value:disabled,
      .repeat-mode:disabled {
        opacity: 0.45;
      }

      .repeat-next {
        margin-top: 6px;
        min-height: 1.2em;
        color: #bbb;
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }

      .combo-stop {
        border-color: #8a6a3a;
        background: rgba(90, 60, 20, 0.75);
      }

      .nav {
        margin-top: 20px;
        font-size: 14px;
      }

      .nav a {
        color: #6aa0d8;
      }

      .feedback {
        min-height: 1.2em;
        margin-top: 14px;
        color: #bbb;
        font-size: 14px;
      }

      .feedback.error {
        color: #f0a0a0;
      }

      .type-panel {
        width: min(720px, 100%);
        margin-top: 24px;
      }

      .type-panel textarea {
        width: 100%;
        min-height: 96px;
        box-sizing: border-box;
        resize: vertical;
        border: 1px solid #666;
        border-radius: 12px;
        background: rgba(0, 0, 0, 0.55);
        color: #eee;
        padding: 12px;
        font: inherit;
      }

      .type-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 10px;
      }

      .type-count {
        color: #bbb;
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }

      .type-send {
        appearance: none;
        border: 1px solid #6aa0d8;
        border-radius: 12px;
        background: rgba(40, 90, 140, 0.85);
        color: #eee;
        padding: 10px 16px;
        font: inherit;
        cursor: pointer;
      }

      .type-send:disabled {
        opacity: 0.45;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <div class="main-block">
      <h1>Controller</h1>
      <p id="status" class="status unpaired">BLE: checking...</p>
      <div id="pad" class="pad"></div>

      <div class="type-panel">
        <h2 class="section-title">Type text</h2>
        <textarea
          id="typeText"
          maxlength="250"
          rows="4"
          placeholder="Enter text to type over Bluetooth"
        ></textarea>
        <div class="type-toolbar">
          <span id="typeCount" class="type-count">0 / 250</span>
          <button type="button" id="typeSend" class="type-send">Send</button>
        </div>
      </div>

      <div class="combo-panel">
        <h2 class="section-title">Combos</h2>
        <div class="table-wrap">
          <table class="combo-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Repeats</th>
                <th>Run</th>
              </tr>
            </thead>
            <tbody id="comboBody">
              <tr class="combo-empty-row">
                <td colspan="3" class="combo-empty">No combos saved.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <p class="nav"><a id="configLink" href="#">Config</a></p>
      <p id="feedback" class="feedback"></p>
    </div>

    <script>

      const HIGHLIGHT_MS = 250;
      const SLOT_COUNT = 7;
      const TEXT_MAX = 250;

        KEY_KP_ENTER: "N⏎",
        KEY_KP_1: "N1",
        KEY_KP_2: "N2",
        KEY_KP_3: "N3",
        KEY_KP_4: "N4",
        KEY_KP_5: "N5",
        KEY_KP_6: "N6",
        KEY_KP_7: "N7",
        KEY_KP_8: "N8",
        KEY_KP_9: "N9",
        KEY_KP_0: "N0",
        KEY_KP_DOT: "N.",
        KEY_KP_EQUAL: "N=",
        KEY_KP_COMMA: "N,",
        KEY_NONUS_BACKSLASH: "¦",
        KEY_APPLICATION: "☰",
        KEY_POWER: "⏻",
        KEY_INTL1: "I1",
        KEY_INTL2: "I2",
        KEY_INTL3: "I3",
        KEY_INTL4: "I4",
        KEY_INTL5: "I5",
        KEY_INTL6: "I6",
        KEY_LANG1: "L1",
        KEY_LANG2: "L2",
        KEY_LANG3: "L3",
        KEY_LANG4: "L4",
        KEY_LANG5: "L5",
        KEY_LCTRL: "Ctrl",
        KEY_LSHIFT: "⇧",
        KEY_LALT: "Alt",
        KEY_LGUI: "⌘",
        KEY_RCTRL: "R⌃",
        KEY_RSHIFT: "R⇧",
        KEY_RALT: "AltGr",
        KEY_RGUI: "R⌘",
      };

      const statusEl = document.getElementById("status");
      const feedbackEl = document.getElementById("feedback");
      const padEl = document.getElementById("pad");
      const comboBody = document.getElementById("comboBody");
      const configLink = document.getElementById("configLink");
      const typeTextEl = document.getElementById("typeText");
      const typeCountEl = document.getElementById("typeCount");
      const typeSendEl = document.getElementById("typeSend");

      configLink.href = API_BASE + "/config";

      function setFeedback(text, isError) {
        feedbackEl.textContent = text || "";
        feedbackEl.className = "feedback" + (isError ? " error" : "");
      }

      function updateTypeCount() {
        var len = typeTextEl.value.length;
        typeCountEl.textContent = len + " / " + TEXT_MAX;
        typeSendEl.disabled = len === 0;
      }

      function sendText() {
        var text = typeTextEl.value;
        if (!text) {
          setFeedback("Enter text to send", true);
          return;
        }
        if (text.length > TEXT_MAX) {
          setFeedback("Error: too_long", true);
          return;
        }

        typeSendEl.disabled = true;
        var body = new URLSearchParams();
        body.set("text", text);

        fetch(API_BASE + "/api/type", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: body.toString(),
        })
          .then(function (response) {
            return response.json().then(function (data) {
              return { ok: response.ok, data: data };
            });
          })
          .then(function (result) {
            if (result.ok && result.data.ok) {
              typeTextEl.value = "";
              updateTypeCount();
              setFeedback("Text queued (" + text.length + " chars)", false);
            } else {
              var err = (result.data && result.data.error) || "failed";
              setFeedback("Error: " + err, true);
              updateTypeCount();
            }
            refreshStatus();
          })
          .catch(function (err) {
            setFeedback("Request failed", true);
            updateTypeCount();
            console.error(err);
          });
      }

      function iconFor(id) {
        return ICON_MAP[id] || "?";
      }

      function isSmallGlyph(glyph) {
        return glyph.length >= 3 || /^[A-Za-z0-9]{1,2}$/.test(glyph);
      }

      function refreshStatus() {
        fetch(API_BASE + "/status")
          .then(function (response) {
            return response.json();
          })
          .then(function (data) {
            if (data.paired) {
              statusEl.textContent = "BLE: paired";
              statusEl.className = "status paired";
            } else {
              statusEl.textContent = "BLE: not paired";
              statusEl.className = "status unpaired";
            }
          })
          .catch(function () {
            statusEl.textContent = "BLE: status unavailable";
            statusEl.className = "status unpaired";
          });
      }

      function sendSlot(slotIndex, button) {
        fetch(API_BASE + "/key?slot=" + encodeURIComponent(slotIndex))
          .then(function (response) {
            return response.json().then(function (data) {
              return { ok: response.ok, data: data };
            });
          })
          .then(function (result) {
            if (result.ok && result.data.ok) {
              button.classList.add("active");
              setTimeout(function () {
                button.classList.remove("active");
              }, HIGHLIGHT_MS);
              setFeedback("Sent slot " + (slotIndex + 1), false);
            } else {
              var err = (result.data && result.data.error) || "failed";
              setFeedback("Error: " + err, true);
            }
            refreshStatus();
          })
          .catch(function (err) {
            setFeedback("Request failed", true);
            console.error(err);
          });
      }

      function renderPad(slots) {
        var html = "";
        for (var i = 0; i < SLOT_COUNT; i++) {
          var slot = slots[i] || { id: "" };
          var glyph = iconFor(slot.id);
          var cls = isSmallGlyph(glyph) ? "glyph small" : "glyph";
          html +=
            '<button type="button" data-slot="' +
            i +
            '"' +
            (i === 2 ? ' class="primary"' : "") +
            ' title="' +
            (slot.id || "") +
            '">' +
            '<span class="' +
            cls +
            '">' +
            glyph +
            "</span></button>";
        }
        padEl.innerHTML = html;

        padEl.querySelectorAll("button").forEach(function (button) {
          var slotIndex = parseInt(button.getAttribute("data-slot"), 10);
          button.addEventListener("click", function () {
            sendSlot(slotIndex, button);
          });
        });
      }

      function escapeHtml(text) {
        return String(text)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      var TEN_MINUTES_MS = 10 * 60 * 1000;
      var MAX_TIMEOUT_MS = 2147483647;
      var repeats = {};

      function renderCombos(combos) {
        if (!combos.length) {
          comboBody.innerHTML =
            '<tr class="combo-empty-row"><td colspan="3" class="combo-empty">No combos saved.</td></tr>';
          return;
        }
        var html = "";
        combos.forEach(function (combo) {
          html +=
            '<tr data-index="' +
            combo.index +
            '">' +
            "<td>" +
            escapeHtml(combo.name) +
            "</td>" +
            '<td class="repeat-cell">' +
            '<div class="repeat-controls">' +
            '<select class="repeat-mode">' +
            '<option value="once" selected>once</option>' +
            '<option value="minutes">minutes</option>' +
            '<option value="hours">hours</option>' +
            "</select>" +
            '<input class="repeat-value" type="number" min="2" step="1" disabled />' +
            "</div>" +
            '<div class="repeat-next"></div>' +
            "</td>" +
            '<td class="row-actions">' +
            '<button type="button" class="combo-btn combo-run">Run</button>' +
            '<button type="button" class="combo-btn combo-stop" hidden>Stop</button>' +
            "</td>" +
            "</tr>";
        });
        comboBody.innerHTML = html;
      }

      function fireCombo(index) {
        var params = new URLSearchParams();
        params.set("index", String(index));
        fetch(API_BASE + "/api/combos_fire", {
          method: "POST",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded",
          },
          body: params.toString(),
        })
          .then(function (response) {
            return response.json().then(function (data) {
              return { ok: response.ok, data: data };
            });
          })
          .then(function (result) {
            if (result.ok && result.data.ok) {
              setFeedback("Combo queued", false);
            } else {
              var err = (result.data && result.data.error) || "fire_failed";
              setFeedback("Error: " + err, true);
            }
          })
          .catch(function (err) {
            setFeedback("Run failed", true);
            console.error(err);
          });
      }

      function syncRepeatInput(row) {
        var mode = row.querySelector(".repeat-mode");
        var input = row.querySelector(".repeat-value");
        var running = !!repeats[row.getAttribute("data-index")];
        if (running) {
          mode.disabled = true;
          input.disabled = true;
          return;
        }
        mode.disabled = false;
        if (mode.value === "once") {
          input.disabled = true;
          return;
        }
        input.disabled = false;
        var value = parseInt(input.value, 10);
        if (mode.value === "minutes") {
          input.min = "2";
          if (!input.value || value < 2) {
            input.value = "2";
          }
        } else {
          input.min = "1";
          if (!input.value || value < 1) {
            input.value = "1";
          }
        }
      }

      function intervalMs(row) {
        var mode = row.querySelector(".repeat-mode").value;
        var value = parseInt(row.querySelector(".repeat-value").value, 10);
        if (mode === "minutes") {
          return value >= 2 ? value * 60 * 1000 : 0;
        }
        if (mode === "hours") {
          return value >= 1 ? value * 60 * 60 * 1000 : 0;
        }
        return 0;
      }

      function formatNext(nextAt) {
        var remaining = nextAt - Date.now();
        if (remaining > TEN_MINUTES_MS) {
          return new Date(nextAt).toLocaleString();
        }
        if (remaining < 0) {
          remaining = 0;
        }
        var totalSeconds = Math.ceil(remaining / 1000);
        var minutes = Math.floor(totalSeconds / 60);
        var seconds = totalSeconds % 60;
        return minutes + ":" + (seconds < 10 ? "0" : "") + seconds;
      }

      function updateRepeatLabels() {
        Object.keys(repeats).forEach(function (index) {
          var row = comboBody.querySelector('tr[data-index="' + index + '"]');
          if (!row || !repeats[index]) {
            return;
          }
          row.querySelector(".repeat-next").textContent = formatNext(repeats[index].nextAt);
        });
      }

      function scheduleNext(index) {
        var state = repeats[index];
        if (!state) {
          return;
        }
        var delay = state.nextAt - Date.now();
        if (delay < 0) {
          delay = 0;
        }
        state.timerId = setTimeout(function () {
          var current = repeats[index];
          if (!current) {
            return;
          }
          if (Date.now() + 500 < current.nextAt) {
            scheduleNext(index);
            return;
          }
          fireCombo(index);
          current.nextAt = Date.now() + current.intervalMs;
          updateRepeatLabels();
          scheduleNext(index);
        }, Math.min(delay, MAX_TIMEOUT_MS));
      }

      function startRepeat(row) {
        var index = row.getAttribute("data-index");
        var interval = intervalMs(row);
        if (!interval) {
          var mode = row.querySelector(".repeat-mode").value;
          setFeedback(mode === "minutes" ? "Minutes must be at least 2" : "Hours must be at least 1", true);
          return;
        }
        stopRepeat(row);
        fireCombo(index);
        repeats[index] = {
          timerId: null,
          nextAt: Date.now() + interval,
          intervalMs: interval,
        };
        row.querySelector(".combo-stop").hidden = false;
        row.querySelector(".combo-run").disabled = true;
        syncRepeatInput(row);
        updateRepeatLabels();
        scheduleNext(index);
      }

      function stopRepeat(row) {
        var index = row.getAttribute("data-index");
        var state = repeats[index];
        if (!state) {
          return;
        }
        clearTimeout(state.timerId);
        delete repeats[index];
        row.querySelector(".combo-stop").hidden = true;
        row.querySelector(".combo-run").disabled = false;
        row.querySelector(".repeat-next").textContent = "";
        syncRepeatInput(row);
      }

      comboBody.addEventListener("change", function (event) {
        if (!event.target.classList.contains("repeat-mode")) {
          return;
        }
        var row = event.target.closest("tr[data-index]");
        if (row) {
          syncRepeatInput(row);
        }
      });

      comboBody.addEventListener("click", function (event) {
        var row = event.target.closest("tr[data-index]");
        if (!row) {
          return;
        }
        if (event.target.classList.contains("combo-run")) {
          if (row.querySelector(".repeat-mode").value === "once") {
            fireCombo(row.getAttribute("data-index"));
          } else {
            startRepeat(row);
          }
        } else if (event.target.classList.contains("combo-stop")) {
          stopRepeat(row);
        }
      });

      setInterval(updateRepeatLabels, 1000);

      function loadPage() {
        fetch(API_BASE + "/api/slots")
          .then(function (r) {
            return r.json();
          })
          .then(function (data) {
            renderPad(data.slots || []);
          })
          .catch(function (err) {
            setFeedback("Failed to load slots", true);
            console.error(err);
            renderPad([]);
          });

        fetch(API_BASE + "/api/combos")
          .then(function (r) {
            return r.json();
          })
          .then(function (data) {
            renderCombos(data.combos || []);
